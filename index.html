<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk &amp; Play Videos</title>
  <meta name="description" content="Bilingual (English/Spanish) AAC game for WH questions, yes/no questions, asking questions, and CVC/VCV/CVCV articulation, driven by YouTube videos.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🗣️ Talk &amp; Play <span class="muted">· Habla y Juega</span></div>
    <nav class="tabs-nav" aria-label="Main">
      <button type="button" data-view="home">📚 Lessons</button>
      <button type="button" data-view="artic">🗣️ Articulation</button>
      <button type="button" data-view="builder">🛠️ Build</button>
      <button type="button" data-view="data">📊 Data</button>
      <button type="button" data-view="settings">⚙️</button>
    </nav>
    <div class="top-controls">
      <label>Student <input id="student-name" type="text" placeholder="Name" autocomplete="off"></label>
      <select id="ui-lang" aria-label="Prompt language">
        <option value="bi">EN + ES</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </div>
  </header>

  <main>
    <!-- Lesson list -->
    <section id="view-home" hidden>
      <div class="row between wrap">
        <h1>Choose a lesson · Escoge una lección</h1>
        <div class="row wrap">
          <label class="btn">⬆️ Import lessons<input id="import-file" type="file" accept=".json,application/json" hidden></label>
          <button id="export-all" class="btn" type="button">⬇️ Export my lessons</button>
        </div>
      </div>
      <div id="lesson-grid" class="lesson-grid"></div>
    </section>

    <!-- Lesson player -->
    <section id="view-play" hidden>
      <div class="row between wrap">
        <button id="back-home" class="btn" type="button">← Lessons</button>
        <h1 id="play-title" class="play-title"></h1>
        <div id="play-tools" class="row"></div>
      </div>
      <div class="play-layout">
        <div id="stage" class="stage">
          <div id="player-box" class="player-box" hidden></div>
          <div id="scene-card" class="scene-card" hidden></div>
        </div>
        <div id="activity-panel" class="activity-panel" aria-live="polite"></div>
      </div>
      <div id="board-root" class="board-root"></div>
      <details id="chart-details" class="card chart">
        <summary>📋 Our predictable chart · Nuestra tabla</summary>
        <div id="chart-body"></div>
        <div class="row wrap">
          <button id="chart-print" class="btn small" type="button">🖨️ Print</button>
          <button id="chart-clear" class="btn small danger" type="button">Clear chart</button>
        </div>
      </details>
    </section>

    <section id="view-artic" hidden>
      <h1>Articulation · Articulación</h1>
      <div id="artic-root"></div>
    </section>

    <section id="view-builder" hidden>
      <h1>Lesson Builder</h1>
      <p class="muted">Paste a YouTube link, play the video, pause where you want a question, then add an activity. It saves on this device.</p>
      <div id="builder-root"></div>
    </section>

    <section id="view-data" hidden>
      <h1>Progress data</h1>
      <div id="data-root"></div>
    </section>

    <section id="view-settings" hidden>
      <div id="settings-root"></div>
    </section>
  </main>

  <div id="print-area" class="print-area" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/core.js"></script>
  <script src="js/data/vocab.js"></script>
  <script src="js/data/artic-words.js"></script>
  <script src="js/data/lessons.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/board.js"></script>
  <script src="js/player.js"></script>
  <script src="js/data-log.js"></script>
  <script src="js/artic.js"></script>
  <script src="js/activities.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
