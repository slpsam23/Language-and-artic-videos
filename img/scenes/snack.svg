  <circle cx="412" cy="318" r="14" fill="#c68642"/><circle cx="440" cy="316" r="14" fill="#c68642"/>
  <g fill="#5a3311"><circle cx="408" cy="315" r="2.5"/><circle cx="416" cy="322" r="2.5"/><circle cx="437" cy="312" r="2.5"/><circle cx="445" cy="320" r="2.5"/></g>
