  <rect x="80" y="120" width="220" height="12" rx="4" fill="#a0522d"/>
  <rect x="100" y="80" width="36" height="40" rx="6" fill="#ffb4a2"/><rect x="150" y="88" width="30" height="32" rx="6" fill="#b5e48c"/><rect x="195" y="76" width="40" height="44" rx="6" fill="#ffd166"/>
  <!-- girl -->
  <g stroke-linecap="round">
    <path d="M262 210 Q 240 260 252 300" stroke="#3d2314" stroke-width="16" fill="none"/>
    <path d="M338 210 Q 360 260 348 300" stroke="#3d2314" stroke-width="16" fill="none"/>
