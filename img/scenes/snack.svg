    <path d="M330 268 Q 352 252 338 232" stroke="#e0ac69" stroke-width="12" fill="none"/>
    <circle cx="300" cy="212" r="33" fill="#e0ac69"/>
    <path d="M266 212 Q 262 172 300 172 Q 338 172 334 212 Q 322 190 300 192 Q 278 190 266 212 Z" fill="#3d2314"/>
    <circle cx="288" cy="214" r="3.5" fill="#222"/><circle cx="312" cy="214" r="3.5" fill="#222"/>
    <circle cx="281" cy="228" r="6" fill="#f4a3a3" opacity=".7"/><circle cx="319" cy="228" r="6" fill="#f4a3a3" opacity=".7"/>
    <ellipse cx="300" cy="231" rx="8" ry="6" fill="#a0522d"/>
    <circle cx="334" cy="228" r="15" fill="#c68642"/>
    <g fill="#5a3311"><circle cx="329" cy="224" r="2.5"/><circle cx="339" cy="230" r="2.5"/><circle cx="332" cy="234" r="2"/></g>
    <circle cx="336" cy="236" r="8" fill="#e0ac69"/>
