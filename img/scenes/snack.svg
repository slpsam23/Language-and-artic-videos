<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A girl eats a cookie and has a glass of milk in the kitchen">
  <rect width="800" height="500" fill="#fde8c8"/>
  <rect y="400" width="800" height="100" fill="#d9b38c"/>
  <g stroke="#c79c70" stroke-width="2"><line x1="0" y1="440" x2="800" y2="440"/><line x1="100" y1="400" x2="80" y2="500"/><line x1="250" y1="400" x2="240" y2="500"/><line x1="400" y1="400" x2="400" y2="500"/><line x1="550" y1="400" x2="560" y2="500"/><line x1="700" y1="400" x2="720" y2="500"/></g>
  <!-- window -->
